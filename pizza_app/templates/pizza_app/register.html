{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register - Pizza App</title>
    <link rel="stylesheet" type="text/css" href="{% static 'pizza_app/css/style.css' %}">
    <style>
        .form-container {
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border: 3px solid #000;
            box-shadow: 6px 6px 0px #000;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #000;
            font-family: inherit;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            background-color: #f0f0f0;
        }
        .errorlist {
            color: #d9534f;
            list-style: none;
            padding: 0;
            margin: 5px 0 0 0;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="hero-container" style="max-width: 450px;">
        <h2>CREATE AN ACCOUNT</h2>
        
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <ul class="errorlist">
                            {% for error in field.errors %}
                                <li>{{ error }}</li>
                            {% endfor %}
                        </ul>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="button" style="width: 100%; margin-top: 10px;">REGISTER</button>
        </form>

        <p style="margin-top: 20px;">
            <a href="{% url 'login' %}">Already have an account? Log in</a>
        </p>
    </div>
</body>
</html>
