{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - Pizza App</title>
    <link rel="stylesheet" type="text/css" href="{% static 'pizza_app/css/style.css' %}">
</head>
<body>
    <div class="hero-container">
        <h2>Log In</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="button">Log In</button>
        </form>
        <p style="margin-top: 15px;"><a href="{% url 'register' %}">Need an account? Register</a></p>
    </div>
</body>
</html>
